<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond arrondi noir -->
  <rect width="512" height="512" rx="120" fill="#121212"/>
  
  <!-- Initiales SL en vert Spotify, grandes et modernes -->
  <text x="256" y="300" 
    font-family="Arial Black, Helvetica Neue, sans-serif" 
    font-size="230" 
    font-weight="900" 
    fill="#1DB954" 
    text-anchor="middle"
    letter-spacing="-8">SL</text>
  
  <!-- Barre verte fine en bas comme soulignement -->
  <rect x="96" y="340" width="320" height="12" rx="6" fill="#1DB954" opacity="0.4"/>
  
  <!-- Petit point vert pulsant = LIVE -->
  <circle cx="256" cy="400" r="10" fill="#1DB954"/>
  <text x="256" y="470" 
    font-family="Arial, sans-serif" 
    font-size="48" 
    font-weight="700" 
    fill="#1DB954" 
    text-anchor="middle" 
    letter-spacing="10"
    opacity="0.7">LIVE</text>
</svg>
